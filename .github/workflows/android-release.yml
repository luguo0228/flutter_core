name: Android Release

on:
  push:
    branches: [master, main]
    tags: ['v*']
  pull_request:
    branches: [master, main]
  workflow_dispatch:
    inputs:
      env:
        description: 打包环境
        type: choice
        options: [prod, test, dev]
        default: prod
      format:
        description: 产物格式
        type: choice
        options: [both, apk, appbundle]
        default: both

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  verify:
    name: 静态检查 + 单测
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version-file: .flutter-version
          cache: true

      - name: 打印工具链版本
        run: |
          echo "锁定版本: $(cat .flutter-version)"
          flutter --version

      - name: 安装依赖
        run: flutter pub get

      - name: 静态分析
        run: flutter analyze

      - name: 单元测试
        run: flutter test

  plan:
    name: 计算构建矩阵
    needs: verify
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      formats: ${{ steps.set.outputs.formats }}
    steps:
      - name: 输出待构建格式
        id: set
        run: |
          case "${{ github.event.inputs.format }}" in
            apk) echo 'formats=["apk"]' >> "$GITHUB_OUTPUT" ;;
            appbundle) echo 'formats=["appbundle"]' >> "$GITHUB_OUTPUT" ;;
            *) echo 'formats=["apk","appbundle"]' >> "$GITHUB_OUTPUT" ;;
          esac

  build:
    name: 构建 ${{ matrix.format }}
    needs: [verify, plan]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        format: ${{ fromJson(needs.plan.outputs.formats) }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version-file: .flutter-version
          cache: true

      - name: 缓存 Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('android/**/*.gradle.kts', 'android/gradle/wrapper/gradle-wrapper.properties') }}

      - name: 兜底生成 Gradle Wrapper
        run: |
          cd android
          [ -f gradlew ] || gradle wrapper --gradle-version 8.14 --distribution-type all
          chmod +x gradlew

      - name: 安装依赖
        run: flutter pub get

      - name: 解析版本号
        id: ver
        run: |
          V=$(grep -m1 '^version:' pubspec.yaml | sed 's/version:[[:space:]]*//' | tr -d "'\"")
          echo "name=${V%%+*}" >> "$GITHUB_OUTPUT"
          echo "code=${V##*+}" >> "$GITHUB_OUTPUT"

      - name: 注入签名密钥
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "未配置 ANDROID_KEYSTORE_BASE64，本次构建回退 debug 签名"
            exit 0
          fi
          echo "$KEYSTORE_BASE64" | base64 --decode > android/app/upload-keystore.jks
          cat > android/key.properties <<EOF
          storeFile=app/upload-keystore.jks
          storePassword=$KEYSTORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF

      - name: 构建 ${{ matrix.format }}
        env:
          APP_ENV: ${{ github.event.inputs.env || 'prod' }}
        run: |
          case "${{ github.ref }}" in
            refs/tags/v*) NAME="${GITHUB_REF_NAME#v}" ;;
            *) NAME="${{ steps.ver.outputs.name }}" ;;
          esac
          NUMBER="${{ steps.ver.outputs.code }}"
          flutter build ${{ matrix.format }} --release \
            --dart-define-from-file="env/$APP_ENV.json" \
            --build-name="$NAME" \
            --build-number="${NUMBER:-${{ github.run_number }}}"
          mkdir -p artifacts
          if [ "${{ matrix.format }}" = "apk" ]; then
            cp build/app/outputs/flutter-apk/app-release.apk \
               "artifacts/base-template-$APP_ENV-$NAME.apk"
          else
            cp build/app/outputs/bundle/release/app-release.aab \
               "artifacts/base-template-$APP_ENV-$NAME.aab"
          fi

      - name: 清理密钥
        if: always()
        run: rm -f android/app/upload-keystore.jks android/key.properties

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: android-${{ matrix.format }}
          path: artifacts/*
          retention-days: 30

  release:
    name: 发布 GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: 下载全部产物
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: 发布 Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*
          generate_release_notes: true
